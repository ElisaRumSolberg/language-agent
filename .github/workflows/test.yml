name: Test

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ./requirements.txt

      - name: Install dependencies
        working-directory: .
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: .
        run: python -m pytest -q
